<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/icons/parsimony-icon.svg" />
    <link rel="apple-touch-icon" href="/icons/parsimony-256.png" />
    <meta name="theme-color" content="#138A63" />
    <title>Parsimony</title>
    <style>
      /* AppLayout (headerSelector="#top-nav") offsets sticky table headers and
         the side nav by this element's height, so it must stay pinned too —
         otherwise content scrolls through the gap it leaves behind. */
      #top-nav {
        position: sticky;
        top: 0;
        z-index: 1002;
      }
    </style>
  </head>
  <body>
    <div id="top-nav"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
