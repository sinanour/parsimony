<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Parsimony</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#138A63"/>
      <stop offset="1" stop-color="#0B4A37"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <g transform="translate(33 0)">
    <!-- Letter P, enlarged to give the coin more room -->
    <rect x="232" y="176" width="112" height="672" rx="16" fill="#F7F5EF"/>
    <path d="M288.0 232.0 H480 A190 190 0 0 1 480 612.0 H288.0" fill="none" stroke="#F7F5EF" stroke-width="112"/>
    <!-- Coin: 81% remainder plus a 19% (68.4 deg) slice pulled out -->
    <path d="M480 422.0 L568.4 405.1 A90 90 0 1 1 496.9 333.6 Z" fill="#E8B64C"/>
    <path d="M495.6 406.4 L512.4 318.0 A90 90 0 0 1 584.0 389.6 Z" fill="#E8B64C"/>
    <!-- Rising bars: reports -->
    <rect x="392" y="788" width="84" height="60" rx="14" fill="#E8B64C"/>
    <rect x="508" y="749" width="84" height="99" rx="14" fill="#E8B64C"/>
    <rect x="624" y="708.0" width="84" height="140.0" rx="14" fill="#E8B64C"/>
  </g>
</svg>
