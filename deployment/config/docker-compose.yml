# Parsimony on a single host: nginx (published) → API (private) → SQLite on a persistent volume.
#
# The deploy CLI copies this file, .env and certs/ into a release directory on the target host and
# runs it there. To run it by hand from this directory instead:
#   cp .env.example .env    # then edit
#   docker compose -p parsimony up -d --build

services:
  backend:
    image: parsimony-backend:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deployment/dockerfiles/Dockerfile.backend
    container_name: parsimony-backend
    env_file: .env
    environment:
      # Fixed inside the container; everything else comes from .env.
      HOST: 0.0.0.0
      PORT: "3001"
      DATA_DIR: /data
      DATABASE_PATH: /data/parsimony.sqlite
      BACKUP_DIR: /data/backups
      TRUST_PROXY: "true"
    volumes:
      # A named volume by default; set DATA_VOLUME_PATH to an absolute host path to use a directory instead.
      - ${DATA_VOLUME_PATH:-parsimony-data}:/data
    networks:
      - internal
    # No ports: the API is reachable only through nginx.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  frontend:
    image: parsimony-frontend:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: deployment/dockerfiles/Dockerfile.frontend
    container_name: parsimony-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    environment:
      ENABLE_HTTPS: ${ENABLE_HTTPS:-false}
      HTTPS_PORT: ${HTTPS_PORT:-443}
      HTTPS_REDIRECT: ${HTTPS_REDIRECT:-true}
      SERVER_NAME: ${SERVER_NAME:-_}
    volumes:
      - ./certs:/etc/nginx/certs:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s
    restart: unless-stopped
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

networks:
  internal: {}

volumes:
  parsimony-data: {}
