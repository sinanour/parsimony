# The Parsimony SPA plus the API proxy. Included by the HTTP or HTTPS server block.
root /usr/share/nginx/html;
index index.html;

# API: never cached by nginx; the backend sets its own security and no-store headers.
location /api/ {
    proxy_pass http://backend:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    # Statement parsing can take a while for long PDFs.
    proxy_read_timeout 180s;
    add_header Strict-Transport-Security $hsts_header always;
}

# Content-hashed build output: safe to cache forever.
location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# The entry point must always be revalidated so a deploy takes effect immediately.
location = /index.html {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
}

location = /health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# Client-side routes fall back to index.html.
location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
}
