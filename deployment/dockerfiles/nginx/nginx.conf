user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Statement uploads go through /api/import/parse.
    client_max_body_size 50m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # HSTS only on HTTPS responses (an empty value means the header is not sent).
    map $scheme $hsts_header {
        https   "max-age=31536000; includeSubDomains";
        default "";
    }

    # Generated at container start by /docker-entrypoint.d/40-configure-parsimony.sh
    include /etc/nginx/conf.d/*.conf;
}
